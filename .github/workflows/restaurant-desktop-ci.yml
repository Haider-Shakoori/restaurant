name: Restaurant Desktop CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-v2
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - 'desktop/**'
    paths:
      - 'desktop/**'
      - '.github/workflows/restaurant-desktop-ci.yml'
      - 'tools/generate_restaurant_icons.py'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/restaurant-desktop-ci.yml'
      - 'tools/generate_restaurant_icons.py'

jobs:
  build-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Could not install Inno Setup." }

      - name: Generate Restaurant brand icon
        working-directory: .
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/generate_restaurant_icons.py --repo-root . --desktop

      - name: Validate Restaurant visual assets
        working-directory: .
        shell: pwsh
        run: |
          python -c "from PIL import Image; app=r'desktop/src/BusinessOS.Restaurant.Desktop/Assets/RestaurantGlassBackground.jpg'; setup=r'desktop/src/BusinessOS.Restaurant.Desktop/Assets/RestaurantInstallerBackground.png'; a=Image.open(app); a.verify(); s=Image.open(setup); assert s.format == 'PNG', f'Installer background must be PNG, got {s.format}'; s.verify(); print(f'Validated {app} and installer-safe PNG {setup}')"

      - name: Restore
        run: dotnet restore BusinessOS.Restaurant.Desktop.slnx

      - name: Build
        run: dotnet build BusinessOS.Restaurant.Desktop.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test BusinessOS.Restaurant.Desktop.slnx --configuration Release --no-build

      - name: Publish Windows x64 single EXE
        shell: pwsh
        run: ./installer/Build-Release.ps1

      - name: Validate release package
        shell: pwsh
        run: |
          $exe = "artifacts/publish/BusinessOS.Restaurant.Desktop.exe"
          if (!(Test-Path $exe)) { throw "Release EXE missing." }
          if ((Get-Item $exe).Length -lt 1MB) { throw "Release EXE is unexpectedly small." }
          $fw = Get-Content "installer/Configure-LanFirewall.ps1" -Raw
          if ($fw -notmatch 'Profile Domain,Private') { throw "Firewall profile scope regression." }
          if ($fw -match 'Profile Public') { throw "Public firewall exposure is forbidden by default." }

      - name: Smoke-test packaged Desktop startup
        shell: pwsh
        run: |
          $exe = "artifacts/publish/BusinessOS.Restaurant.Desktop.exe"
          $logRoot = Join-Path $env:LOCALAPPDATA "BusinessOS\Restaurant\logs"

          if (Test-Path $logRoot) {
            Get-ChildItem $logRoot -Filter "desktop-*.log" -ErrorAction SilentlyContinue |
              Remove-Item -Force -ErrorAction SilentlyContinue
          }

          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()

          if ($process.HasExited) {
            if (Test-Path $logRoot) {
              Get-ChildItem $logRoot -Filter "desktop-*.log" |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 1 |
                ForEach-Object { Get-Content $_.FullName -Tail 200 }
            }
            throw "Packaged Restaurant Desktop exited during startup smoke test."
          }

          if (Test-Path $logRoot) {
            $startupErrors = Get-ChildItem $logRoot -Filter "desktop-*.log" |
              ForEach-Object { Get-Content $_.FullName -Raw } |
              Where-Object { $_ -match "Main window initialization" -or $_ -match "(?m)^\[[^\]]+\] ui$" }

            if ($startupErrors) {
              $startupErrors | ForEach-Object { Write-Host $_ }
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "Packaged Restaurant Desktop logged a UI/startup failure."
            }
          }

          Stop-Process -Id $process.Id -Force

      - name: Build branded Windows installer
        shell: pwsh
        run: |
          $iscc = @(
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles(x86)\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $iscc) {
            $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
          }

          Remove-Item "installer/output" -Recurse -Force -ErrorAction SilentlyContinue
          & $iscc "/DMyAppVersion=1.0.0" "installer/BusinessOS.Restaurant.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }

          $setup = Get-ChildItem "installer/output" -Filter "BusinessOS-Restaurant-Setup-*-win-x64.exe" |
            Select-Object -First 1
          if (-not $setup) { throw "Branded Restaurant installer was not produced." }
          if ($setup.Length -lt 1MB) { throw "Restaurant installer is unexpectedly small." }

      - name: Smoke-test branded installer startup
        shell: pwsh
        timeout-minutes: 2
        run: |
          $setup = Get-ChildItem "installer/output" -Filter "BusinessOS-Restaurant-Setup-*-win-x64.exe" |
            Select-Object -First 1
          if (-not $setup) { throw "Restaurant installer missing before runtime smoke test." }

          # Inno Setup's bootstrap EXE launches the real wizard in a temporary
          # child process. Inspect every matching Setup process so we validate
          # the actual wizard/error dialog rather than only the bootstrapper.
          $before = @(Get-Process | Select-Object -ExpandProperty Id)
          $bootstrap = Start-Process -FilePath $setup.FullName -PassThru
          try {
            Start-Sleep -Seconds 8

            $candidates = @(
              Get-Process -ErrorAction SilentlyContinue |
                Where-Object {
                  ($before -notcontains $_.Id) -and
                  (
                    $_.Id -eq $bootstrap.Id -or
                    $_.ProcessName -like "$($setup.BaseName)*" -or
                    $_.ProcessName -like "BusinessOS-Restaurant-Setup*"
                  )
                }
            )

            if (-not $candidates) {
              throw "Branded Restaurant installer did not leave a Setup process running."
            }

            $titles = @(
              $candidates |
                ForEach-Object {
                  $_.Refresh()
                  [PSCustomObject]@{
                    Id = $_.Id
                    ProcessName = $_.ProcessName
                    Title = $_.MainWindowTitle
                  }
                }
            )

            $titles | Format-Table -AutoSize | Out-String | Write-Host
            $visibleTitles = @($titles | Where-Object { -not [string]::IsNullOrWhiteSpace($_.Title) })

            if ($visibleTitles | Where-Object { $_.Title -match "(?i)^Error$|Bitmap image is not valid" }) {
              throw "Installer runtime opened an error dialog instead of the setup wizard."
            }

            if (-not ($visibleTitles | Where-Object { $_.Title -match "(?i)BusinessOS Restaurant|Setup" })) {
              throw "The Inno Setup child process did not expose the expected Restaurant setup window."
            }
          }
          finally {
            Get-Process -ErrorAction SilentlyContinue |
              Where-Object {
                ($before -notcontains $_.Id) -and
                (
                  $_.Id -eq $bootstrap.Id -or
                  $_.ProcessName -like "$($setup.BaseName)*" -or
                  $_.ProcessName -like "BusinessOS-Restaurant-Setup*"
                )
              } |
              Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Upload unsigned CI release
        uses: actions/upload-artifact@v4
        with:
          name: BusinessOS-Restaurant-win-x64-ci
          path: desktop/artifacts/publish/
          if-no-files-found: error

      - name: Upload branded installer
        uses: actions/upload-artifact@v4
        with:
          name: BusinessOS-Restaurant-Setup-win-x64-ci
          path: desktop/installer/output/BusinessOS-Restaurant-Setup-*-win-x64.exe
          if-no-files-found: error
