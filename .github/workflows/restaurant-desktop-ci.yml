name: Restaurant Desktop CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - 'desktop/**'
    paths:
      - 'desktop/**'
      - '.github/workflows/restaurant-desktop-ci.yml'
      - 'tools/generate_restaurant_icons.py'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/restaurant-desktop-ci.yml'
      - 'tools/generate_restaurant_icons.py'

jobs:
  build-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate Restaurant brand icon
        working-directory: .
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/generate_restaurant_icons.py --repo-root . --desktop

      - name: Restore
        run: dotnet restore BusinessOS.Restaurant.Desktop.slnx

      - name: Build
        run: dotnet build BusinessOS.Restaurant.Desktop.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test BusinessOS.Restaurant.Desktop.slnx --configuration Release --no-build

      - name: Publish Windows x64 single EXE
        shell: pwsh
        run: ./installer/Build-Release.ps1

      - name: Validate release package
        shell: pwsh
        run: |
          $exe = "artifacts/publish/BusinessOS.Restaurant.Desktop.exe"
          if (!(Test-Path $exe)) { throw "Release EXE missing." }
          if ((Get-Item $exe).Length -lt 1MB) { throw "Release EXE is unexpectedly small." }
          $fw = Get-Content "installer/Configure-LanFirewall.ps1" -Raw
          if ($fw -notmatch 'Profile Domain,Private') { throw "Firewall profile scope regression." }
          if ($fw -match 'Profile Public') { throw "Public firewall exposure is forbidden by default." }

      - name: Smoke-test packaged Desktop startup
        shell: pwsh
        run: |
          $exe = "artifacts/publish/BusinessOS.Restaurant.Desktop.exe"
          $logRoot = Join-Path $env:LOCALAPPDATA "BusinessOS\Restaurant\logs"

          if (Test-Path $logRoot) {
            Get-ChildItem $logRoot -Filter "desktop-*.log" -ErrorAction SilentlyContinue |
              Remove-Item -Force -ErrorAction SilentlyContinue
          }

          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()

          if ($process.HasExited) {
            if (Test-Path $logRoot) {
              Get-ChildItem $logRoot -Filter "desktop-*.log" |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 1 |
                ForEach-Object { Get-Content $_.FullName -Tail 200 }
            }
            throw "Packaged Restaurant Desktop exited during startup smoke test."
          }

          if (Test-Path $logRoot) {
            $startupErrors = Get-ChildItem $logRoot -Filter "desktop-*.log" |
              ForEach-Object { Get-Content $_.FullName -Raw } |
              Where-Object { $_ -match "Main window initialization" -or $_ -match "(?m)^\[[^\]]+\] ui$" }

            if ($startupErrors) {
              $startupErrors | ForEach-Object { Write-Host $_ }
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "Packaged Restaurant Desktop logged a UI/startup failure."
            }
          }

          Stop-Process -Id $process.Id -Force

      - name: Upload unsigned CI release
        uses: actions/upload-artifact@v4
        with:
          name: BusinessOS-Restaurant-win-x64-ci
          path: desktop/artifacts/publish/
          if-no-files-found: error
