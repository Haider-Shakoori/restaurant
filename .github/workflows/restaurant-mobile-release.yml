name: Restaurant Mobile Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/restaurant-mobile-release.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/restaurant-mobile-release.yml'

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold
        run: |
          flutter create --platforms=android --org af.businessos --project-name businessos_restaurant_waiter --no-pub .
          rm -f test/widget_test.dart

      - name: Configure Android permissions and LAN HTTP
        run: dart run tool/configure_android.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          dart format lib test tool
          flutter analyze
          flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: BusinessOS-Restaurant-Waiter-android-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  ios-unsigned:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS scaffold
        run: |
          flutter create --platforms=ios --org af.businessos --project-name businessos_restaurant_waiter --no-pub .
          rm -f test/widget_test.dart

      - name: Configure iOS QR camera disclosure
        run: dart run tool/configure_ios.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          dart format lib test tool
          flutter analyze
          flutter test

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        run: |
          rm -rf build/unsigned-ipa
          mkdir -p build/unsigned-ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/unsigned-ipa/Payload/
          cd build/unsigned-ipa
          zip -qry ../BusinessOS-Restaurant-Waiter-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: BusinessOS-Restaurant-Waiter-unsigned-ipa
          path: mobile/build/BusinessOS-Restaurant-Waiter-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
