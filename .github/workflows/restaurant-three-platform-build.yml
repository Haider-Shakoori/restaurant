name: Restaurant Fresh Platform Builds

on:
  push:
    branches:
      - build/restaurant-three-platform-20261013
    paths:
      - .github/workflows/restaurant-three-platform-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-unsigned:
    name: Fresh iOS unsigned IPA
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS app project
        run: |
          flutter create --platforms=ios --org af.businessos --project-name businessos_restaurant_waiter --no-pub .
          rm -f test/widget_test.dart
      - name: Configure iOS and Restaurant title
        run: dart run tool/configure_ios.dart
      - name: Generate Restaurant icons
        working-directory: .
        run: |
          python3 -m venv .icon-venv
          source .icon-venv/bin/activate
          python -m pip install --disable-pip-version-check pillow
          python tools/generate_restaurant_icons.py --repo-root . --ios
      - name: Dependencies and tests
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Compile unsigned iOS app
        env:
          RESTAURANT_FIREBASE_API_KEY: ${{ vars.RESTAURANT_FIREBASE_API_KEY }}
          RESTAURANT_FIREBASE_ANDROID_APP_ID: ${{ vars.RESTAURANT_FIREBASE_ANDROID_APP_ID }}
          RESTAURANT_FIREBASE_IOS_APP_ID: ${{ vars.RESTAURANT_FIREBASE_IOS_APP_ID }}
          RESTAURANT_FIREBASE_SENDER_ID: ${{ vars.RESTAURANT_FIREBASE_SENDER_ID }}
          RESTAURANT_FIREBASE_PROJECT_ID: ${{ vars.RESTAURANT_FIREBASE_PROJECT_ID }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=RESTAURANT_FIREBASE_API_KEY="$RESTAURANT_FIREBASE_API_KEY" \
            --dart-define=RESTAURANT_FIREBASE_ANDROID_APP_ID="$RESTAURANT_FIREBASE_ANDROID_APP_ID" \
            --dart-define=RESTAURANT_FIREBASE_IOS_APP_ID="$RESTAURANT_FIREBASE_IOS_APP_ID" \
            --dart-define=RESTAURANT_FIREBASE_SENDER_ID="$RESTAURANT_FIREBASE_SENDER_ID" \
            --dart-define=RESTAURANT_FIREBASE_PROJECT_ID="$RESTAURANT_FIREBASE_PROJECT_ID"
      - name: Verify actual iOS app name and required permissions
        run: |
          plist=build/ios/iphoneos/Runner.app/Info.plist
          test -f "$plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")" = Restaurant
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist")" = Restaurant
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsLocalNetworking' "$plist")" = true
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$plist"
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$plist"
      - name: Package Restaurant.ipa
        run: |
          mkdir -p build/unsigned-ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/unsigned-ipa/Payload/
          cd build/unsigned-ipa
          zip -qry ../Restaurant.ipa Payload
          test -s ../Restaurant.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Restaurant-iOS-unsigned-20261013
          path: mobile/build/Restaurant.ipa
          if-no-files-found: error
          retention-days: 30

  android-apk:
    name: Fresh Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: |
          flutter create --platforms=android --org af.businessos --project-name businessos_restaurant_waiter --no-pub .
          rm -f test/widget_test.dart
      - name: Configure Android and displayed app name
        run: |
          dart run tool/configure_android.dart
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          src = path.read_text()
          import re
          src, count = re.subn(r'android:label="[^"]+"', 'android:label="Restaurant"', src, count=1)
          assert count == 1, "Android display label not found"
          path.write_text(src)
          assert 'android:label="Restaurant"' in path.read_text()
          PY
      - name: Generate Restaurant icons
        working-directory: .
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 tools/generate_restaurant_icons.py --repo-root . --android
      - name: Dependencies and tests
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Compile release APK
        env:
          RESTAURANT_FIREBASE_API_KEY: ${{ vars.RESTAURANT_FIREBASE_API_KEY }}
          RESTAURANT_FIREBASE_ANDROID_APP_ID: ${{ vars.RESTAURANT_FIREBASE_ANDROID_APP_ID }}
          RESTAURANT_FIREBASE_IOS_APP_ID: ${{ vars.RESTAURANT_FIREBASE_IOS_APP_ID }}
          RESTAURANT_FIREBASE_SENDER_ID: ${{ vars.RESTAURANT_FIREBASE_SENDER_ID }}
          RESTAURANT_FIREBASE_PROJECT_ID: ${{ vars.RESTAURANT_FIREBASE_PROJECT_ID }}
        run: |
          flutter build apk --release \
            --dart-define=RESTAURANT_FIREBASE_API_KEY="$RESTAURANT_FIREBASE_API_KEY" \
            --dart-define=RESTAURANT_FIREBASE_ANDROID_APP_ID="$RESTAURANT_FIREBASE_ANDROID_APP_ID" \
            --dart-define=RESTAURANT_FIREBASE_IOS_APP_ID="$RESTAURANT_FIREBASE_IOS_APP_ID" \
            --dart-define=RESTAURANT_FIREBASE_SENDER_ID="$RESTAURANT_FIREBASE_SENDER_ID" \
            --dart-define=RESTAURANT_FIREBASE_PROJECT_ID="$RESTAURANT_FIREBASE_PROJECT_ID"
          cp build/app/outputs/flutter-apk/app-release.apk build/Restaurant.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Restaurant-Android-APK-20261013
          path: mobile/build/Restaurant.apk
          if-no-files-found: error
          retention-days: 30

  windows-unsigned:
    name: Fresh Windows unsigned EXE
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Generate Restaurant desktop branding
        working-directory: .
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/generate_restaurant_icons.py --repo-root . --desktop
      - name: Restore build and test
        shell: pwsh
        run: |
          dotnet restore BusinessOS.Restaurant.Desktop.slnx
          if ($LASTEXITCODE -ne 0) { throw "Restore failed" }
          dotnet build BusinessOS.Restaurant.Desktop.slnx --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
          dotnet test BusinessOS.Restaurant.Desktop.slnx --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) { throw "Tests failed" }
      - name: Publish self-contained unsigned Windows x64 application
        shell: pwsh
        run: |
          ./installer/Build-Release.ps1 -CertificatePath '' -CertificatePassword ''
          if ($LASTEXITCODE -ne 0) { throw "Publish failed" }
          $exe = "artifacts/publish/BusinessOS.Restaurant.Desktop.exe"
          if (!(Test-Path $exe)) { throw "Windows EXE missing" }
          if ((Get-Item $exe).Length -lt 1MB) { throw "Windows EXE unexpectedly small" }
          $signature = Get-AuthenticodeSignature -FilePath $exe
          if ($signature.Status -ne "NotSigned") { throw "EXE is not unsigned: $($signature.Status)" }
          Get-FileHash -Path $exe -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: Restaurant-Windows-x64-unsigned-20261013
          path: desktop/artifacts/publish/
          if-no-files-found: error
          retention-days: 30
