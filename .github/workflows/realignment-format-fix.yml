name: Temporary Realignment Format Fix

on:
  push:
    branches:
      - feat/kot-realignment-web
    paths:
      - '.github/workflows/realignment-format-fix.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/kot-realignment-web

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, sqlite3, zip, bcmath, intl
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - working-directory: mobile
        run: flutter pub get

      - working-directory: mobile
        run: dart format lib test

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format KOT realignment changes"
          git push origin HEAD:feat/kot-realignment-web
