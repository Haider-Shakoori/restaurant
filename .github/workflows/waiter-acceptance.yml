name: Restaurant Waiter Acceptance
on:
  push:
    branches: [feat/waiter-stability-ui-sprint-01]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lan-acceptance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test multi-waiter ordering and sync
        shell: pwsh
        run: dotnet test desktop/tests/BusinessOS.Restaurant.Tests/BusinessOS.Restaurant.Tests.csproj --configuration Release --filter 'FullyQualifiedName~LocalOrderingTests' --logger 'trx;LogFileName=waiter-lan.trx' --results-directory acceptance-results
      - name: Test signing, activation, offline renewal, and cloud isolation
        shell: pwsh
        run: dotnet test desktop/tests/BusinessOS.Restaurant.Tests/BusinessOS.Restaurant.Tests.csproj --configuration Release --filter 'FullyQualifiedName~LicensingTests|FullyQualifiedName~OfflineRenewalFileTests|FullyQualifiedName~OfflineNetworkBoundaryTests' --logger 'trx;LogFileName=waiter-license.trx' --results-directory acceptance-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waiter-lan-tests
          path: acceptance-results/*.trx
          if-no-files-found: ignore

  mobile-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify mobile offline and KOT flows
        working-directory: mobile
        run: |
          flutter pub get
          flutter test test/sync_engine_test.dart test/kot_round_reconciliation_test.dart test/desktop_partial_sync_conflict_test.dart test/order_operations_safety_test.dart test/legacy_order_upgrade_test.dart
