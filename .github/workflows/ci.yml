name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mysql-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, mysql, pdo_mysql, zip, bcmath, intl
          coverage: none
      - name: Start MySQL locally without Docker Hub pulls
        run: |
          if ! sudo systemctl start mysql; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mariadb-server
            sudo systemctl start mariadb
          fi
          sudo mysql -e "CREATE DATABASE IF NOT EXISTS restaurant_ci; CREATE USER IF NOT EXISTS 'ci_restaurant'@'%' IDENTIFIED BY 'ci_password'; GRANT ALL PRIVILEGES ON *.* TO 'ci_restaurant'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;"
      - name: Install PHP packages
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Smoke test full MySQL tenant migrations and repeated idempotent execution
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: restaurant_ci
          DB_USERNAME: ci_restaurant
          DB_PASSWORD: ci_password
          DB_URL: ''
          CENTRAL_DOMAINS: localhost,127.0.0.1
        run: |
          php artisan config:clear
          php artisan migrate --force
          php artisan tinker --execute="App\\Models\\Tenant::create(['id' => 'mysql-kot-smoke', 'provisioning_state' => 'ready']);"
          php artisan tenants:migrate --tenants=mysql-kot-smoke --force
          php artisan tinker --execute="tenancy()->initialize(App\\Models\\Tenant::findOrFail('mysql-kot-smoke')); (require database_path('migrations/tenant/2026_10_07_221000_add_kot_dispatch_rounds.php'))->up(); tenancy()->end();"
          php artisan tenants:migrate --tenants=mysql-kot-smoke --force

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, sqlite3, zip, bcmath, intl
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Composer security audit
        run: composer audit

      - name: Laravel Pint
        run: vendor/bin/pint --test

      - name: Cache production configuration and views
        run: |
          php artisan config:cache
          php artisan config:clear
          php artisan route:cache
          php artisan route:clear
          php artisan view:cache
          php artisan view:clear

      - name: Migration smoke test
        run: php artisan migrate:fresh --force

      - name: PHPUnit
        run: php artisan test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

  mobile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform scaffold
        working-directory: mobile
        run: |
          flutter create --platforms=android --org af.businessos --project-name businessos_restaurant_waiter --no-pub .
          rm -f test/widget_test.dart

      - name: Configure Android local-network HTTP support
        working-directory: mobile
        run: dart run tool/configure_android.dart

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Format Dart sources
        working-directory: mobile
        run: dart format lib test

      - name: Analyze Flutter
        working-directory: mobile
        run: flutter analyze

      - name: Test Flutter
        working-directory: mobile
        run: flutter test

      - name: Build Android debug APK
        working-directory: mobile
        run: flutter build apk --debug
